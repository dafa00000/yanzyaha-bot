<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 450px;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', sans-serif; overflow: hidden;
  }
  .container {
    text-align: center; position: relative; z-index: 2;
  }
  .glow {
    position: absolute; width: 300px; height: 300px;
    background: radial-gradient(circle, #00d4ff33 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  }
  .icon { font-size: 80px; margin-bottom: 10px; }
  .title {
    font-size: 52px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #00d4ff, #ffffff, #00d4ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none;
  }
  .subtitle {
    font-size: 18px; color: #00d4ff99; letter-spacing: 6px;
    margin-top: 8px; text-transform: uppercase;
  }
  .line {
    width: 200px; height: 2px; margin: 16px auto;
    background: linear-gradient(90deg, transparent, #00d4ff, transparent);
  }
  .tagline { font-size: 14px; color: #ffffff66; letter-spacing: 2px; }
  .dots {
    position: absolute; width: 100%; height: 100%;
    top: 0; left: 0; z-index: 1;
    background-image: radial-gradient(circle, #ffffff11 1px, transparent 1px);
    background-size: 30px 30px;
  }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="container">
    <div class="icon">⚡</div>
    <div class="title">YANZYAHA-BOT</div>
    <div class="line"></div>
    <div class="subtitle">WhatsApp Assistant</div>
    <div class="tagline">Powered by Groq · Llama 3.3 · Baileys</div>
  </div>
</body>
</html>
